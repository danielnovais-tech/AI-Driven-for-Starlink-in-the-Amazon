[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
addopts = -ra
norecursedirs = .git .venv venv build dist __pycache__

# Keep CI output readable by silencing known noisy warnings.
filterwarnings =
    ignore:.*Box low's precision lowered by casting to float32.*:UserWarning
    ignore:.*Box high's precision lowered by casting to float32.*:UserWarning
